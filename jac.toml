[project]
name = "agriPulse"
version = "0.1.0"
description = "A full-stack Jac application"
entry-point = "main"
kind = "web-app"
jac-version = "==0.37.25"

[dependencies]
[dependencies.npm]
react = "^19.2.0"
react-dom = "^19.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.7.0"
typescript = "^5.3.3"
"@types/react" = "^19.2.0"
"@types/react-dom" = "^19.2.0"



[dev-dependencies]
[dev-dependencies.pypi]
watchdog = ">=3.0.0"


[client]

[jacpack]
name = 'https___github_com_Afshad-M_agriPulse_git'
description = 'Jac IDE snapshot for https___github_com_Afshad-M_agriPulse_git'

[jachammer]
project_id = "prj_01774d93c5794003aa2c427b0631f8eb"

# Added by C (see .env.example). On jac 0.37.25 the old [plugins.byllm.model]
# path from earlier docs no longer parses - byllm is a built-in capability,
# configured with a top-level [byllm] table, and `jac install` pulls its
# optional deps (litellm etc.) into .jac/venv once this is declared.
[byllm.model]
api_key = "${GOOGLE_API_KEY}"
default_model = "${LLM_MODEL:-gemini/gemini-3.8-flash}"

[placement.pins]
# Whole-module pin (not per-function): a plain `def` pinned individually to
# "client" inside an otherwise server-anchored module never gets a real ES
# export in the client bundle (jac-codespaces: only exposed :pub/:protect
# declarations and client-placed VALUES cross a module boundary that way).
# Pinning the whole module moves every declaration in it - mock_state
# included - so api_layer.jac's `import from mock_api { ... }` resolves.
mock_api = "client"
# Same reasoning, same fix: mock_layer.jac (C) holds the plain fetch_merge_routes/
# fetch_replan wrappers split out of api_layer.jac (see that file's header).
mock_layer = "client"
# api_layer.jac (C) imports api.jac -> logic.jac for the real load_seed/
# baseline_plan RPC calls; logic.jac's graph-filter syntax can't lower to
# the client bundle (E5097), so this stays explicitly server, with its
# fetch_seed/fetch_baseline_plan as def:pub RPC endpoints instead.
api_layer = "server"
